# InventoryInvoiceApp - run with Docker only (no source code needed).
#
#   1. Install Docker Desktop
#   2. Save this file, open a terminal in the same folder, and run:
#        docker compose -f docker-compose.hub.yml up -d
#   3. Open http://localhost:8080
#      Demo login: admin@inventory.com / Admin@123
#
# Stop:   docker compose -f docker-compose.hub.yml down
# Reset:  docker compose -f docker-compose.hub.yml down -v
#
# All passwords are DEMO values for local use only.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Test@12345}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: ramaalshomali/inventoryinvoiceapp-dbinit:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Test@12345}"
    restart: "no"

  web:
    image: ramaalshomali/inventoryinvoiceapp-web:latest
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=InventoryInvoiceDatabase;User Id=inventory_app;Password=${APP_DB_PASSWORD:-AppUser@2026};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqldata:
